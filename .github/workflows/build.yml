name: Build and Release

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]

env:
  DOTNET_VERSION: '10.0.x'
  PROJECT_PATH: 'src/LiveMapDesktop/LiveMapDesktop.csproj'
  OUTPUT_DIR: 'publish'

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore dependencies
      run: dotnet restore ${{ env.PROJECT_PATH }}

    - name: Build
      run: dotnet build ${{ env.PROJECT_PATH }} -c Release --no-restore

    - name: Publish
      run: dotnet publish ${{ env.PROJECT_PATH }} -c Release -o ${{ env.OUTPUT_DIR }} --no-build -r win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: LiveMapDesktop
        path: ${{ env.OUTPUT_DIR }}/LiveMapDesktop.exe

  release:
    needs: build
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download artifact
      uses: actions/download-artifact@v4
      with:
        name: LiveMapDesktop
        path: release/

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: release/LiveMapDesktop.exe
        draft: false
        prerelease: false
        generate_release_notes: true
