<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft LiveMap</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
          crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
            crossorigin=""></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #1a1a2e;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #e0e0e0;
        }

        #map {
            width: 100%;
            height: 100%;
            min-height: 400px;
            z-index: 1;
        }

        .map-overlay {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 1000;
            background: rgba(26, 26, 46, 0.9);
            border: 1px solid #f0a500;
            border-radius: 6px;
            padding: 12px 16px;
            color: #e0e0e0;
            font-size: 13px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
            max-width: 280px;
        }

        .map-overlay h3 {
            color: #f0a500;
            font-size: 14px;
            margin-bottom: 6px;
            font-weight: 600;
        }

        .map-overlay p {
            margin: 3px 0;
            color: #a0a0b0;
            font-size: 12px;
        }

        .seed-display {
            color: #f0a500;
            font-weight: bold;
            font-size: 13px;
        }

        .coords-display {
            margin-top: 6px;
            padding-top: 6px;
            border-top: 1px solid #2a2a4e;
            color: #a0a0b0;
            font-size: 11px;
        }

        /* Dark theme overrides for Leaflet controls */
        .leaflet-control-zoom a {
            background-color: #16213e !important;
            color: #f0a500 !important;
            border-color: #f0a500 !important;
        }

        .leaflet-control-zoom a:hover {
            background-color: #1a1a2e !important;
            color: #ffcc33 !important;
        }

        .leaflet-control-attribution {
            background: rgba(26, 26, 46, 0.8) !important;
            color: #a0a0b0 !important;
        }

        .leaflet-control-attribution a {
            color: #f0a500 !important;
        }

        .leaflet-popup-content-wrapper {
            background-color: #16213e !important;
            color: #e0e0e0 !important;
            border: 1px solid #f0a500 !important;
            border-radius: 6px !important;
        }

        .leaflet-popup-tip {
            background-color: #16213e !important;
            border: 1px solid #f0a500 !important;
        }
    </style>
</head>
<body>
    <div id="map"></div>

    <div class="map-overlay">
        <h3>Seed Information</h3>
        <p>Seed: <span class="seed-display" id="seedLabel">None loaded</span></p>
        <p>Biome: <span id="biomeLabel">-</span></p>
        <p>Markers: <span id="markerCount">0</span></p>
        <div class="coords-display">
            X: <span id="coordX">0</span>, Z: <span id="coordZ">0</span>
        </div>
        <button id="seedfinder-trigger" style="margin-top:8px;width:100%;padding:6px;background:rgba(240,165,0,0.15);border:1px solid rgba(240,165,0,0.3);border-radius:4px;color:#f0a500;font-size:11px;cursor:pointer;font-weight:600;">🔍 Seed Finder</button>
    </div>

    <script>
        // Initialize the map with a dark theme
        const map = L.map('map', {
            center: [0, 0],
            zoom: 3,
            minZoom: 1,
            maxZoom: 8,
            zoomControl: true,
            attributionControl: true,
            preferCanvas: true
        });

        // Add a dark-themed tile layer using CartoDB Dark Matter (free, no key needed)
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
            subdomains: 'abcd',
            maxZoom: 8
        }).addTo(map);

        // Store markers
        let markers = [];
        let currentSeed = null;

        // Generate pseudo-random positions from seed string
        function generateFromSeed(seed, count) {
            const positions = [];
            let hash = 0;
            for (let i = 0; i < seed.length; i++) {
                const char = seed.charCodeAt(i);
                hash = ((hash << 5) - hash) + char;
                hash |= 0;
            }

            const seededRandom = function() {
                const x = Math.sin(hash++) * 10000;
                return x - Math.floor(x);
            };

            // Generate various marker positions
            const markerTypes = [
                { name: 'Spawn', icon: '🏁', color: '#f0a500' },
                { name: 'Village', icon: '🏘️', color: '#4CAF50' },
                { name: 'Stronghold', icon: '🏰', color: '#9C27B0' },
                { name: 'Temple', icon: '🏛️', color: '#00BCD4' },
                { name: 'Ocean Monument', icon: '🌊', color: '#2196F3' },
                { name: 'Woodland Mansion', icon: '🏚️', color: '#795548' },
                { name: 'Mineshaft', icon: '⛏️', color: '#607D8B' },
                { name: 'Ruined Portal', icon: '🔮', color: '#FF5722' },
                { name: 'Pillager Outpost', icon: '🚩', color: '#E91E63' },
                { name: 'Bastion Remnant', icon: '🔥', color: '#FF9800' },
                { name: 'End City', icon: '🌌', color: '#673AB7' },
                { name: 'Ancient City', icon: '💎', color: '#00BCD4' }
            ];

            for (let i = 0; i < count; i++) {
                const lat = (seededRandom() - 0.5) * 60;
                const lng = (seededRandom() - 0.5) * 80;
                const type = markerTypes[i % markerTypes.length];
                positions.push({
                    lat: lat,
                    lng: lng,
                    type: type
                });
            }
            return positions;
        }

        // Clear existing markers
        function clearMarkers() {
            markers.forEach(m => map.removeLayer(m));
            markers = [];
        }

        // Add markers for seed
        function addMarkersForSeed(seed) {
            clearMarkers();

            const positions = generateFromSeed(seed, 12);
            const bounds = [];

            positions.forEach(pos => {
                const marker = L.circleMarker([pos.lat, pos.lng], {
                    radius: 8,
                    fillColor: pos.type.color,
                    color: pos.type.color,
                    weight: 2,
                    opacity: 0.9,
                    fillOpacity: 0.6
                }).addTo(map);

                marker.bindPopup(`
                    <div style="color: #e0e0e0; font-family: 'Segoe UI', sans-serif;">
                        <strong style="color: #f0a500;">${pos.type.icon} ${pos.type.name}</strong><br>
                        <span style="font-size: 11px; color: #a0a0b0;">
                            X: ${Math.round(pos.lng * 50)} | Z: ${Math.round(pos.lat * 50)}
                        </span>
                    </div>
                `);

                markers.push(marker);
                bounds.push([pos.lat, pos.lng]);
            });

            // Update marker count document.getElementById('markerCount').textContent = markers.length;

            // Fit bounds
            if (bounds.length > 0) {
                map.fitBounds(bounds, { padding: [40, 40], maxZoom: 6 });
            }
        }

        // Determine "biome" based on seed hash
        function getBiomeForSeed(seed) {
            const biomes = [
                'Plains', 'Desert', 'Savanna', 'Forest', 'Birch Forest',
                'Dark Forest', 'Swamp', 'Taiga', 'Snowy Taiga', 'Jungle',
                'Old Growth Pine Taiga', 'Meadow', 'Cherry Grove', 'Mushroom Fields',
                'Ice Spikes', 'Windswept Hills', 'Jagged Peaks', 'Stony Shore',
                'Mangrove Swamp', 'Deep Dark'
            ];
            let hash = 0;
            for (let i = 0; i < seed.length; i++) {
                hash = ((hash << 5) - hash) + seed.charCodeAt(i);
                hash |= 0;
            }
            return biomes[Math.abs(hash) % biomes.length];
        }

        // Main update function called from C#
        function updateSeed(seed) {
            if (!seed || seed.trim() === '') {
                return;
            }

            currentSeed = seed.trim();

            // Update UI
            document.getElementById('seedLabel').textContent = currentSeed;
            document.getElementById('biomeLabel').textContent = getBiomeForSeed(currentSeed);
            document.getElementById('markerCount').textContent = '0';

            // Add markers
            addMarkersForSeed(currentSeed);

            // Notify C#
            if (window.chrome && window.chrome.webview) {
                window.chrome.webview.postMessage('Seed loaded: ' + currentSeed);
            }
        }

        // Track mouse position on map
        map.on('mousemove', function(e) {
            document.getElementById('coordX').textContent = Math.round(e.latlng.lng * 50);
            document.getElementById('coordZ').textContent = Math.round(e.latlng.lat * 50);
        });

        // Track clicks to place custom markers
        map.on('click', function(e) {
            const marker = L.marker([e.latlng.lat, e.latlng.lng], {
                title: 'Custom Waypoint'
            }).addTo(map);

            marker.bindPopup(`
                <div style="color: #e0e0e0;">
                    <strong style="color: #f0a500;">📍 Waypoint</strong><br>
                    <span style="font-size: 11px; color: #a0a0b0;">
                        X: ${Math.round(e.latlng.lng * 50)} | Z: ${Math.round(e.latlng.lat * 50)}
                    </span>
                </div>
            `).openPopup();

            markers.push(marker);
            document.getElementById('markerCount').textContent = markers.length;
        });

        // Initial state        document.getElementById('seedLabel').textContent = 'None loaded';

        // Notify C# that map is ready
        if (window.chrome && window.chrome.webview) {
            window.chrome.webview.postMessage('Map initialized and ready');        
        }
    </script>
    <script src="js/seedfinder.js"></script>
    <script src="js/coordReader.js"></script>
    <script src="js/waypoints.js"></script>
    <script src="js/settings.js"></script>
</body>
</html>
